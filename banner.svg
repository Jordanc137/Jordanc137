<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Jordan Breña — Data Analyst, Python, ML/AI, Matemáticas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1226"/>
      <stop offset="0.6" stop-color="#0F1B3D"/>
      <stop offset="1" stop-color="#14264F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A24B"/>
      <stop offset="0.5" stop-color="#F2D98B"/>
      <stop offset="1" stop-color="#C9A24B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F2D98B" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .name { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 76px; letter-spacing: 6px; fill: #F5F1E6; }
      .role { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 26px; letter-spacing: 3px; fill: #F2D98B; }
      .tag  { font-family: Consolas, 'Courier New', monospace; font-size: 18px; fill: #8FA3C7; }
      .sym  { font-family: 'Times New Roman', Georgia, serif; fill: #F2D98B; fill-opacity: 0.10; }
      .fade { opacity: 0; animation: fadeIn 1.2s ease-out forwards; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.5s; } .d3 { animation-delay: 0.9s; }
      .line { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.4s ease-out 0.3s forwards; }
      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <text class="sym" x="880" y="150" font-size="190">∫</text>
  <text class="sym" x="1020" y="260" font-size="150">Σ</text>
  <text class="sym" x="760" y="290" font-size="110">λ</text>
  <text class="sym" x="1090" y="110" font-size="90">π</text>

  <rect x="0" y="0" width="10" height="320" fill="url(#gold)"/>

  <text class="name fade d1" x="70" y="140">JORDAN BREÑA</text>
  <line class="line" x1="72" y1="165" x2="592" y2="165" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <text class="role fade d2" x="72" y="212">DATA ANALYST  ·  PYTHON  ·  ML / AI</text>
  <text class="tag fade d3" x="72" y="258">&gt; matemáticas aplicadas · pipelines de datos · dashboards que se entienden</text>
</svg>
