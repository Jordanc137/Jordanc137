<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Jordan Breña — Data Analyst, Python, C/C++, C#, ML/AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010308"/>
      <stop offset="0.55" stop-color="#040C1F"/>
      <stop offset="1" stop-color="#071A3D"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E63FF"/>
      <stop offset="0.5" stop-color="#4FE3FF"/>
      <stop offset="1" stop-color="#0E63FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1AA8FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1AA8FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hexgrid" width="46" height="80" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <path d="M23 0 L46 13 L46 40 L23 53 L0 40 L0 13 Z" fill="none" stroke="#1AA8FF" stroke-opacity="0.10" stroke-width="1"/>
      <path d="M23 53 L46 66 L46 93 L23 106 L0 93 L0 66 Z" transform="translate(0,-26)" fill="none" stroke="#1AA8FF" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.2" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .name { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 72px; letter-spacing: 7px; fill: #EAF7FF; }
      .role { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 4px; fill: #4FE3FF; }
      .tag  { font-family: Consolas, 'Courier New', monospace; font-size: 17px; fill: #5E86B8; }
      .hud  { font-family: Consolas, 'Courier New', monospace; font-size: 12px; letter-spacing: 2px; fill: #2E86D6; fill-opacity: 0.85; }
      .fade { opacity: 0; animation: fadeIn 1.1s ease-out forwards; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.5s; } .d3 { animation-delay: 0.9s; }
      .line { stroke-dasharray: 560; stroke-dashoffset: 560; animation: draw 1.4s ease-out 0.3s forwards; }
      .scan { animation: scan 4.5s linear infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      .spin-slow { transform-origin: 1080px 160px; animation: spin 22s linear infinite; }
      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes scan { 0% { transform: translateX(-60px); opacity: 0; } 8% { opacity: 0.55; } 50% { opacity: 0.18; } 92% { opacity: 0.55; } 100% { transform: translateX(1260px); opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 0.9; } }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#hexgrid)"/>

  <!-- ambient HUD glow cluster, right side -->
  <circle cx="1030" cy="160" r="230" fill="url(#glow)"/>

  <!-- rotating hex ring motif (Ultron-style targeting ring) -->
  <g class="spin-slow" opacity="0.55">
    <circle cx="1080" cy="160" r="92" fill="none" stroke="#1AA8FF" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 10"/>
    <circle cx="1080" cy="160" r="118" fill="none" stroke="#1AA8FF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 14"/>
    <circle cx="1080" cy="160" r="70" fill="none" stroke="#4FE3FF" stroke-width="1.4" stroke-opacity="0.45"/>
  </g>
  <g opacity="0.8">
    <circle cx="1080" cy="160" r="46" fill="none" stroke="#4FE3FF" stroke-width="1.6" filter="url(#softGlow)"/>
    <circle cx="1080" cy="160" r="4" fill="#4FE3FF" filter="url(#softGlow)"/>
  </g>

  <!-- scan line sweep -->
  <rect class="scan" x="0" y="0" width="3" height="320" fill="#4FE3FF" filter="url(#softGlow)"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="6" height="320" fill="url(#blue)"/>

  <!-- HUD corner brackets -->
  <g stroke="#1AA8FF" stroke-width="2" fill="none" opacity="0.8">
    <path d="M1160 22 L1178 22 L1178 40"/>
    <path d="M1160 298 L1178 298 L1178 280"/>
  </g>
  <text class="hud" x="1140" y="16" text-anchor="end">SYS::PROFILE_OK</text>
  <text class="hud pulse" x="1140" y="308" text-anchor="end">STATUS // ACTIVE</text>

  <text class="name fade d1" filter="url(#neon)" x="68" y="138">JORDAN BREÑA</text>
  <line class="line" x1="70" y1="162" x2="618" y2="162" stroke="url(#blue)" stroke-width="3" stroke-linecap="round"/>
  <text class="role fade d2" x="70" y="206">DATA ANALYST &#183; PYTHON &#183; C / C++ / C# &#183; ML·AI</text>
  <text class="tag fade d3" x="70" y="250">&gt; pipelines de datos · dashboards · matemáticas aplicadas · bilingüe ES/EN</text>
</svg>
